[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/latekaapi/agentic-ui"

[workspace.dependencies]
# gpui is published as the `gpui-pre` family; gpui-kit pins the matching set.
gpui = { package = "gpui-pre", version = "0.3.1" }
gpui-kit = "0.6.0"
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rust-embed = "8"
image = "0.25"

# Internal crates
aui-tokens = { path = "crates/aui-tokens" }
aui-motion = { path = "crates/aui-motion" }
aui-icons = { path = "crates/aui-icons" }
aui = { path = "crates/aui" }
aui-protocol = { path = "crates/aui-protocol" }
aui-webview = { path = "crates/aui-webview" }
aui-terminal = { path = "crates/aui-terminal" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
