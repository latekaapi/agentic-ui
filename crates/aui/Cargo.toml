[package]
name = "aui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Agentic UI component library: shell, sidebar, transcript, composer, workbench, feedback and overlay components on gpui + gpui-kit, styled by aui-tokens and animated by aui-motion."

[dependencies]
gpui.workspace = true
gpui-kit.workspace = true
aui-tokens.workspace = true
aui-icons.workspace = true
aui-motion.workspace = true
aui-protocol.workspace = true
anyhow.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }

[features]
default = []
# Route `transcript::syntax_runs` through gpui-kit's tree-sitter highlighter
# (gpui-component's `SyntaxHighlighter`) instead of the small lexer. Off by
# default: it pulls five grammar crates and their C sources.
tree-sitter = [
    "gpui-kit/tree-sitter",
    "gpui-kit/tree-sitter-rust",
    "gpui-kit/tree-sitter-typescript",
    "gpui-kit/tree-sitter-tsx",
    "gpui-kit/tree-sitter-python",
    "gpui-kit/tree-sitter-bash",
]

[dev-dependencies]
# `test-support` gives the example `Window::render_to_image` parity with the
# gallery's screenshot path and lets `#[gpui::test]` build a real window.
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
aui-protocol.workspace = true

[[example]]
name = "minimal"
path = "examples/minimal.rs"
