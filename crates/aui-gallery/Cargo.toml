[package]
name = "aui-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gallery app for the Agentic UI (aui) component library: every design card live, theme and density switches, a motion playground and a --screenshot flag for parity checks."

[[bin]]
name = "aui-gallery"
path = "src/main.rs"

# The real backends. Off by default so `cargo run -p aui-gallery` still needs
# no browser and no shell; on, the three `-real` entries appear beside the
# scripted ones, which are left exactly as they were.
[features]
default = []
wry = ["aui-webview/wry"]
pty = ["aui-terminal/pty"]
tui = ["aui-terminal/tui"]

[dependencies]
# `test-support` exposes `Window::render_to_image`, which the --screenshot flag uses.
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui-kit.workspace = true
aui-tokens.workspace = true
aui-icons.workspace = true
aui-motion.workspace = true
aui.workspace = true
aui-webview.workspace = true
aui-terminal.workspace = true
anyhow.workspace = true
image.workspace = true
